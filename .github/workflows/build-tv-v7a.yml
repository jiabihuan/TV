name: Build TV (Leanback) V7A APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Use installed JDK for Gradle daemon
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Build leanback armeabi-v7a release APK
        run: |
          ./gradlew :app:assembleLeanbackArmeabi_v7aRelease --no-daemon --no-build-cache --stacktrace 2>&1 | tee build.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p Release/apk
          # Debug: show all possible output directories
          echo "=== Searching for APK files ==="
          echo "--- All build output directories ---"
          find . -type d -name "outputs" -not -path "*/.gradle/*" -not -path "*/node_modules/*" 2>/dev/null | head -20
          echo "--- APK files found ---"
          find . -name "*.apk" -type f -not -path "*/.gradle/*" -not -path "*/node_modules/*" 2>/dev/null | while read f; do
            cp "$f" Release/apk/
            echo "Copied: $f"
          done
          echo "--- Files in Release/apk ---"
          ls -la Release/apk/ 2>/dev/null || echo "Release/apk is empty"
          # Also check for Android App Bundle (AAB) outputs
          echo "--- AAB files found ---"
          find . -name "*.aab" -type f -not -path "*/.gradle/*" -not -path "*/node_modules/*" 2>/dev/null | head -10
          # Append to build log for debugging
          echo "" >> build.log
          echo "=== APK Collection Results ===" >> build.log
          find . -name "*.apk" -type f -not -path "*/.gradle/*" -not -path "*/node_modules/*" >> build.log 2>&1
          ls -la Release/apk/ >> build.log 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: leanback-armeabi-v7a-release-apk
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Commit build result
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .github/build-logs
          if [ -f build.log ]; then cp build.log .github/build-logs/latest-tv-v7a-build.log; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .github/build-logs/latest-tv-v7a-build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No build result files to commit"
          else
            git commit -m "Update TV V7A build result [skip ci]"
            git push || echo "::warning::Build log push failed."
